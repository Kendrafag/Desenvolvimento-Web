# exemplo deu um netlify.toml
[build]
  base = "Segundo bimestre/Aula01/musica-side"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirecionamento de todas as rotas para /index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200